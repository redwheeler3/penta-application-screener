# Fly.io deployment (M17, ADR 0012). Single-region app that suspends to zero when idle and
# keeps a persistent volume for the SQLite DB.
# Secrets (SESSION_SECRET, GOOGLE_CLIENT_*, AWS_*, OPENAI_API_KEY,
# ANTHROPIC_API_KEY, SOCKETLABS_*) are set via `fly secrets set`, never here.
#
# First-time setup (run once, from the repo root):
#   fly launch --no-deploy --copy-config     # or `fly apps create penta-application-screener`
#   fly volumes create screener_data --region iad --size 1
#   fly secrets set SESSION_SECRET=$(openssl rand -hex 32) \
#       GOOGLE_CLIENT_ID=... GOOGLE_CLIENT_SECRET=... \
#       AWS_ACCESS_KEY_ID=... AWS_SECRET_ACCESS_KEY=...
#   fly deploy
#   fly certs add screener.pentacoop.com    # then add the CNAME it prints

app = "penta-application-screener"
primary_region = "iad"   # Ashburn — lower-cost region; Bedrock runs in nearby us-east-1.

[build]
  dockerfile = "Dockerfile"

[env]
  # Non-secret runtime config. The DB path is relative to the backend workdir (/app/backend),
  # so this file lands on the mounted volume below. FRONTEND_URL / GOOGLE_REDIRECT_URI use the
  # real hostname — single-origin, so the frontend and API share it.
  DATABASE_URL = "sqlite:///./data/penta_screener.db"
  FRONTEND_URL = "https://screener.pentacoop.com"
  PUBLIC_WEBSITE_URL = "https://www.pentacoop.com"
  GOOGLE_REDIRECT_URI = "https://screener.pentacoop.com/auth/google/callback"
  AWS_REGION = "us-east-1"          # Bedrock region (matches settings default)
  AWS_DEFAULT_REGION = "us-east-1"  # botocore reads this one
  # No post-rank auto-snapshot in prod — that was a local heavy-iteration safety net; Fly
  # volume snapshots cover durability here (see docs/deploy.md). Defaults on for local dev.
  LOCAL_DB_BACKUPS = "false"

[[mounts]]
  # Persists the SQLite DB across deploys and suspend/resume. Create it once (see above);
  # 1GB is far more than the ~20MB DB needs, at ~$0.15/mo.
  source = "screener_data"
  destination = "/app/backend/data"
  snapshot_retention = 30

[http_service]
  internal_port = 8080
  force_https = true          # redirect http→https at the edge
  auto_stop_machines = "suspend" # preserve process memory for a sub-second resume.
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    # A rank holds one long streaming request for minutes; keep the machine awake while any
    # request is in flight. Low limits suit a ~5-member committee and a single machine.
    type = "requests"
    hard_limit = 25
    soft_limit = 20

  [[http_service.checks]]
    # Liveness: the /health route (no auth) confirms the app booted and migrations ran.
    # Grace period covers cold-start + `alembic upgrade head` on a fresh machine.
    method = "get"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

# One small shared-CPU machine is ample for ~5 users; a rank is I/O-bound on Bedrock calls,
# not CPU. 512MB gives headroom for the Python process + the SQLite page cache.
[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
